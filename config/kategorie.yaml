# Návrh číselníku kategorií usnesení (verze pilot). Usnesení může mít víc kategorií.
samosprava: Orgány města, volby, komise, program, jednací řád
majetek_najem: Nájmy, pachty a výpůjčky majetku města
majetek_prevod: Prodej, nákup, směna, darování nemovitostí
rozpocet: Rozpočet, rozpočtová opatření, závěrečný účet
investice: Stavby, rekonstrukce, opravy, projektová dokumentace
verejne_zakazky: Zadávací řízení, výběr dodavatele, komise pro hodnocení nabídek
prispevkove_organizace: Řízení a hospodaření příspěvkových organizací
skolstvi: Školy a školky
sport: Sport a volný čas
kultura: Kultura a cestovní ruch
socialni: Sociální služby a zdravotnictví
voda_odpady: Vodovod, kanalizace, ČOV, odpady
doprava: Doprava a parkování
dotace_dary: Dotace, příspěvky, přijaté a poskytnuté dary
lazne_spolecnosti: Obchodní společnosti města
personalni: Personální věci, odměny
podnety: Podněty a stížnosti občanů
ostatni: Jinam nezařaditelné
