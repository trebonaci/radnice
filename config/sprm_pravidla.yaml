# Přiřazení karet investic k aktivitám Strategického plánu rozvoje města 2021–2030 (#168).
# Aktivity: raw/sprm/projekty.json (evidence trebonaci.cz). Pravidlo = regulární výraz na název a popis karty.
# Karta v data/projekty/*.yaml může mít vlastní `sprm: [id]` (ta mají přednost a jsou potvrzená).
# potvrzeno: false = NÁVRH Clauda, který musí potvrdit Ondřej; na webu se ukáže jako návrh.
- vzor: '\bMK\b|^Ulice |stavební úpravy .*ul\.'
