name: Kontrola

on:
  pull_request:
  push:
    # main + větve agentů (PR otevřený přes GITHUB_TOKEN sám CI nespustí, výsledek z push se ale v PR zobrazí)
    branches: [main, "claude/**", "codex/**"]
  # spouští beh.yml a claude.yml na větvích, které vytvořily přes GITHUB_TOKEN (to samo CI nespustí)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Sestavení dat a kontroly (citace, částky, anonymizace, osoby)
        run: python -m pipeline.sestav

      - name: Commitnutá data odpovídají sestavení
        run: |
          if ! git diff --exit-code -- data/; then
            echo "::error::Soubory v data/ neodpovídají výsledku 'python -m pipeline.sestav'. Spusťte sestavení a commitněte výsledek."
            exit 1
          fi

      - name: Kontrola workflow souborů (actionlint)
        run: |
          pip install actionlint-py
          # actionlint zná starší seznam vstupů claude-code-action; restrict_untrusted_prs ve v1 existuje (action.yml)
          actionlint -ignore 'input "restrict_untrusted_prs" is not defined' .github/workflows/*.yml

      - name: Testy
        run: python -m pytest -v
