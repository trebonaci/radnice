# Pracovní zásobník projektů města Třeboně a městských společností (#172).
#
# NEJDE o dokument schválený radou ani zastupitelstvem. Je to pracovní přehled konkrétních
# projektů, které se připravují, ale ještě nemají kartu investice (zakázku na stavbu).
# Rozhodnutí Ondřeje 21. 11. 2026: zásobník vedeme jako pracovní dokument; ukazujeme i neoceněné,
# ale reálné nápady; projekty městských společností uvádíme s nositelem.
#
# Položka:
#   id          krátký identifikátor (malá písmena, pomlčky)
#   nazev       název srozumitelný občanovi
#   popis       volitelně, jedna věta
#   oblast      doprava | voda_odpady | sport | skolstvi | socialni | bydleni | kultura | lazne | zelen | jine
#   vazby.hledat  vzory (regulární výrazy) pro smlouvy a zakázky na studii / projekt; z nich kód odvodí
#               nositele (zadavatele) a stav připravenosti (doloženo smlouvou nebo zakázkou)
#   zdroj       {url, datum, popis} – nutné u položky bez dokladu ve smlouvách/zakázkách (jen záměr)
#   odhad       volitelně {hodnota, s_dph, url, citace} – odhad nákladů opsaný ze zdroje
#   sprm        volitelně [id aktivit SPRM] – potvrzené přiřazení (jinak návrh podle config/sprm_pravidla.yaml)
#
# Reálný = má veřejný doklad (smlouvu nebo zakázku na přípravu) nebo jiný uvedený veřejný zdroj.
# Položku, ke které se objeví zakázka na stavbu, je čas převést na kartu v data/projekty/.

