# Katalog míst a služeb pro karty měkkých aktivit (#183, rozhodnutí Ondřeje 21. 11. 2026).
#
# Karta místa nebo služby sbírá změny z usnesení („Co se mění pro vás“) i investice a položky zásobníku
# do toho místa. Spravuje se ručně.
#
#   id          krátký identifikátor
#   nazev       jak místo lidé znají
#   oblast      sport | kultura | socialni | skolstvi | komunity_spolky | doprava | voda_odpady | jine
#   popis       volitelně, jedna věta
#   misto       volitelně, jako u karet investic (#180): adresa / cp + cast_obce / ulice / bod
#   zmeny       vzory (regulární výrazy) hledané v „kdo“ a textu změny → naše propojení
#   investice   id karet investic (data/projekty, auto-vz-*) – ručně, doloženo
#   zasobnik    id položek zásobníku – ručně

